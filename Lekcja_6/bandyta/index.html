<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Jednoręki bandyta</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <div class="balance">
            <p class="saldo">Saldo: <samp class="cash"></samp></p>
            <div class="buttons">
                <input type="button" value="+100" id="add100">
                <input type="button" value="+500" id="add500">
                <input type="button" value="+1000" id="add1000">
            </div>
        </div>

        <span class="navigation">
            <input type="button" value="SPIN !" class="btn">
        </span>

        <span class="cards">
            <span class="card" id="c1"></span>
            <span class="card" id="c2"></span>
            <span class="card" id="c3"></span>
            <span class="card" id="c4"></span>
            <span class="card" id="c5"></span>
        </span>
    </main>
    <script src="script.js"></script>
</body>

</html>
